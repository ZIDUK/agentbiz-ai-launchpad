<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="240" height="80" role="img" aria-label="Mid-Market Lender">
  <defs>
    <linearGradient id="mml-mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <!-- Brand mark: three ascending columns with gold accent -->
  <g transform="translate(12, 14)">
    <rect x="0"  y="22" width="8" height="20" fill="url(#mml-mark)"/>
    <rect x="12" y="14" width="8" height="28" fill="url(#mml-mark)"/>
    <rect x="24" y="4"  width="8" height="38" fill="url(#mml-mark)"/>
    <rect x="36" y="0"  width="6" height="42" fill="#F59E0B"/>
  </g>
  <!-- Wordmark: serif for financial weight -->
  <text x="64" y="38" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" fill="currentColor" letter-spacing="-0.2">Mid-Market</text>
  <text x="64" y="56" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" fill="currentColor" opacity="0.6" letter-spacing="2.5">LENDER · EST. 1998</text>
</svg>
