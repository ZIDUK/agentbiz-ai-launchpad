<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="240" height="80" role="img" aria-label="B2B Services Co.">
  <defs>
    <linearGradient id="b2b-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <!-- Brand mark: stacked geometric blocks forming a "B" -->
  <g transform="translate(12, 14)">
    <rect x="0"  y="0"  width="34" height="10" fill="#1F2937"/>
    <rect x="0"  y="0"  width="10" height="42" fill="#1F2937"/>
    <rect x="0"  y="16" width="34" height="10" fill="url(#b2b-mark)"/>
    <rect x="0"  y="32" width="34" height="10" fill="url(#b2b-mark)"/>
    <rect x="0"  y="32" width="10" height="10" fill="#1F2937"/>
  </g>
  <!-- Wordmark: bold geometric sans -->
  <text x="58" y="34" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="currentColor" letter-spacing="-0.5">B2B</text>
  <text x="58" y="54" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="currentColor" opacity="0.65" letter-spacing="0.8">services.co</text>
</svg>
