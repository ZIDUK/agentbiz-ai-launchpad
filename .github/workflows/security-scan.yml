name: Security scan

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  malware-scan:
    name: Malware pattern scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run malware scan
        run: |
          chmod +x scripts/scan-malware.sh
          ./scripts/scan-malware.sh .

      - name: Confirm pushed commits are clean
        # Defense in depth: even if a pre-push hook is bypassed, fail the CI
        # run if any of the just-pushed commits introduce the watched files
        # with content larger than the last known-good baseline.
        run: |
          set -e
          THRESHOLD=1000
          for f in postcss.config.js scripts/generate-sitemap.mjs; do
            if git show "HEAD:$f" >/dev/null 2>&1; then
              longest=$(git show "HEAD:$f" | awk '{ print length }' | sort -nr | head -1)
              if [ "$longest" -gt "$THRESHOLD" ]; then
                echo "::error::$f has a $longest-char line in HEAD (threshold $THRESHOLD)"
                exit 1
              fi
            fi
          done
          echo "Pushed commits clean."

  quality:
    name: Tests lint and build
    needs: malware-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          BETTER_AUTH_SECRET: ci-only-not-a-production-secret-000000000000
          BETTER_AUTH_URL: http://localhost:3000
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
